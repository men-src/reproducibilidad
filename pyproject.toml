[project]
name = "men-reproducibilidad"
version = "2026.10.29"
description = "Regenera los informes en PDF de la Plataforma de Analítica de Datos del MEN desde los agregados publicados"
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer==3.5.2",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "fonttools==4.68.0",
    "kiwisolver==1.5.1",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "packaging==26.3",
    "pillow==13.0.0",
    "pyparsing==3.3.3",
    "python-dateutil==2.9.0.post0",
    "reportlab==5.1.0",
    "six==1.17.0",
]

[tool.setuptools.packages.find]
include = ["men_platform*"]
